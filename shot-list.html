<html lang="en">

  <title>Wedding Shot List</title>

  <style>

      --text-muted: #7a7060;
      --pose: #a8c4a2;

    }
    body { min-height: 100vh; background: var(--bg); font-family: 'DM Sans', sans-serif; padding-bottom: 80px; color: var(--text); }
    header { padding: 52px 24px 44px; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #1a1510 0%, #0f0f0f 100%); }
    .header-eyebrow { font-size: 10px; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; margin-bottom: 12px; }

    header h1 em { font-style: italic; color: var(--gold-light); }
    .header-sub { margin-top: 10px; font-size: 12px; color: var(--text-muted); letter-spacing: 0.08em; }
    .progress-wrap { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .progress-ring-wrap { position: relative; width: 64px; height: 64px; }
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-bg { fill: none; stroke: #2a2a2a; stroke-width: 4; }
    .progress-ring-fill { fill: none; stroke: var(--gold); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 163; stroke-dashoffset: 163; transition: stroke-dashoffset 0.5s ease; }
    .progress-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: var(--gold-light); }
    .progress-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em; }
    .legend { display: flex; gap: 16px; justify-content: center; margin-top: 14px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; }
    .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; background: #111; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; padding: 14px 18px; font-size: 11px; font-family: 'DM Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
    .tab.active { color: var(--gold-light); border-bottom-color: var(--gold); }
    .content { max-width: 560px; margin: 0 auto; padding: 0 16px; }
    .page { display: none; }
    .page.active { display: block; }
    .cat-label { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin: 28px 0 12px 4px; }
    .section { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border); }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; cursor: pointer; border-bottom: 1px solid var(--border); user-select: none; -webkit-tap-highlight-color: transparent; }
    .section-title { display: flex; align-items: center; gap: 10px; }
    .section-emoji { font-size: 18px; }
    .section-name { font-size: 14px; font-weight: 500; color: var(--text); }
    .section-meta { display: flex; align-items: center; gap: 8px; }
    .section-count { font-size: 10px; color: var(--gold); background: rgba(201,169,110,0.1); border-radius: 20px; padding: 2px 8px; }
    .section-arrow { font-size: 18px; color: var(--text-muted); transition: transform 0.25s; }
    .section.closed .section-arrow { transform: rotate(-90deg); }
    .section.closed .section-header { border-bottom: none; }
    .section.closed .section-items { display: none; }
    .item { display: flex; align-items: flex-start; gap: 13px; padding: 13px 18px; border-bottom: 1px solid #1f1f1f; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; transition: background 0.15s; }
    .item:last-child { border-bottom: none; }
    .item.done { background: #161616; }
    .checkbox { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid #3a3a3a; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .item.done .checkbox { background: var(--gold); border-color: var(--gold); }
    .checkmark { display: none; width: 11px; height: 11px; }
    .item.done .checkmark { display: block; }
    .item-text { flex: 1; }
    .item-label { font-size: 13.5px; color: var(--text); line-height: 1.4; transition: all 0.2s; }
    .item.done .item-label { color: var(--text-muted); text-decoration: line-through; }
    .prompts { margin-top: 7px; display: flex; flex-direction: column; gap: 4px; }
    .prompt { font-size: 11px; line-height: 1.45; padding: 4px 8px; border-radius: 5px; }
    .prompt.pose { color: var(--pose); background: rgba(168,196,162,0.08); border-left: 2px solid rgba(168,196,162,0.3); }
    .prompt.tech { color: var(--tech); background: rgba(138,180,212,0.08); border-left: 2px solid rgba(138,180,212,0.3); }
    .prompt-tag { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; margin-right: 4px; }
    .footer { text-align: center; max-width: 560px; margin: 0 auto; padding: 0 16px; }
    .complete-msg { display: none; background: linear-gradient(135deg, #2a1f0a, #3d2e10); border: 1px solid var(--gold); color: var(--gold-light); border-radius: 14px; padding: 18px 24px; font-size: 14px; margin-top: 28px; }
    .reset-btn { background: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 24px; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--text-muted); cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 28px; }
  </style>
</head>

</header>

const state = {};
let totalItems = 0;

data.forEach(page => {
  page.categories.forEach(cat => {
    cat.sections.forEach(sec => {
      sec.items.forEach(item => {
        const key = page.tab + '__' + sec.title + '__' + item.text;
        state[key] = false;
        totalItems++;
      });
    });
  });
});

function updateProgress() {
  const checked = Object.values(state).filter(Boolean).length;
  const pct = Math.round((checked / totalItems) * 100);
  const offset = 163 - (pct / 100) * 163;
  document.getElementById('ring-fill').style.strokeDashoffset = offset;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-label').textContent = checked + ' of ' + totalItems + ' shots captured';
  document.getElementById('complete-msg').style.display = pct === 100 ? 'block' : 'none';
  document.getElementById('reset-btn').style.display = pct === 100 ? 'none' : 'inline-block';
  data.forEach(page => {
    page.categories.forEach(cat => {
      cat.sections.forEach(sec => {
        const done = sec.items.filter(i => state[page.tab + '__' + sec.title + '__' + i.text]).length;
        const el = document.getElementById('cnt-' + page.tab + sec.title);
        if (el) el.textContent = done + '/' + sec.items.length;
      });
    });
  });
}

function toggleItem(key, el) {
  state[key] = !state[key];
  el.classList.toggle('done', state[key]);
  updateProgress();
}

function toggleSection(id) {
  document.getElementById(id).classList.toggle('closed');
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('active', i === idx));
}

function resetAll() {
  Object.keys(state).forEach(k => state[k] = false);
  document.querySelectorAll('.item').forEach(el => el.classList.remove('done'));
  updateProgress();
}

const tabsEl = document.getElementById('tabs');
data.forEach((page, idx) => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (idx === 0 ? ' active' : '');
  btn.textContent = page.tab;
  btn.addEventListener('click', () => switchTab(idx));
  tabsEl.appendChild(btn);
});

const pagesEl = document.getElementById('pages');
data.forEach((page, idx) => {
  const pageEl = document.createElement('div');
  pageEl.className = 'page' + (idx === 0 ? ' active' : '');
  const contentEl = document.createElement('div');
  contentEl.className = 'content';

  page.categories.forEach(cat => {
    const catLabel = document.createElement('div');
    catLabel.className = 'cat-label';
    catLabel.textContent = cat.label;
    contentEl.appendChild(catLabel);

    cat.sections.forEach(sec => {
      const secId = 'sec-' + page.tab + sec.title;
      const secEl = document.createElement('div');
      secEl.className = 'section';
      secEl.id = secId;

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `
        <div class="section-title">
          <span class="section-emoji">${sec.emoji}</span>
          <span class="section-name">${sec.title}</span>
        </div>
        <div class="section-meta">
          <span class="section-count" id="cnt-${page.tab + sec.title}">0/${sec.items.length}</span>
          <span class="section-arrow">›</span>
        </div>
      `;
      header.addEventListener('click', () => toggleSection(secId));

      const itemsEl = document.createElement('div');
      itemsEl.className = 'section-items';

      sec.items.forEach(item => {
        const key = page.tab + '__' + sec.title + '__' + item.text;
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="checkbox">
            <svg class="checkmark" viewBox="0 0 11 11" fill="none">
              <path d="M1.5 5.5l3 3 5-5" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="item-text">
            <div class="item-label">${item.text}</div>
            <div class="prompts">
              ${item.pose ? `<div class="prompt pose"><span class="prompt-tag">Pose</span>${item.pose}</div>` : ''}
              ${item.tech ? `<div class="prompt tech"><span class="prompt-tag">Tech</span>${item.tech}</div>` : ''}
            </div>
          </div>
        `;
        div.addEventListener('click', () => toggleItem(key, div));
        itemsEl.appendChild(div);
      });

      secEl.appendChild(header);
      secEl.appendChild(itemsEl);
      contentEl.appendChild(secEl);
    });
  });

  pageEl.appendChild(contentEl);
  pagesEl.appendChild(pageEl);
});

updateProgress();
</script>
