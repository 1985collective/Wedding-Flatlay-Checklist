:root {
  --brown-dark: #3d2314;
  --brown-mid: #7a3f28;
  --brown-light: #c27c58;
  --cream: #fdf8f4;
  --cream-mid: #f3ece6;
  --text: #3d2314;
  --text-muted: #b09080;
}

body {
  min-height: 100vh;
  background: var(--cream);
  font-family: 'Jost', sans-serif;
  padding-bottom: 60px;
}

/* HEADER */
header {
  background: linear-gradient(160deg, #3d2314 0%, #7a3f28 55%, #c27c58 100%);
  padding: 48px 24px 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute;
  top: -50px; right: -50px;
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.07);
}
header::after {
  content: '';
  position: absolute;
  bottom: -40px; left: -40px;
  width: 160px; height: 160px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.06);
}
.header-label {
  font-size: 11px;
  letter-spacing: 0.25em;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  margin-bottom: 10px;
}
header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 34px;
  color: #fff;
  line-height: 1.2;
  letter-spacing: 0.03em;
}
header h1 em {
  font-style: italic;
  font-size: 28px;
  color: rgba(255,255,255,0.85);
}

/* PROGRESS */
.progress-wrap {
  margin-top: 28px;
}
.progress-label {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.progress-bar-bg {
  height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  max-width: 240px;
  margin: 0 auto;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #e8c9a0, #fff);
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* CONTENT */
.content {
  max-width: 500px;
  margin: 0 auto;
  padding: 0 16px;
}

/* SECTION */
.section {
  margin-top: 20px;
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(61,35,20,0.07);
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  cursor: pointer;
  border-bottom: 1px solid var(--cream-mid);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.section-header:active { background: #fdf8f4; }
.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-emoji { font-size: 20px; }
.section-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--brown-dark);
  letter-spacing: 0.01em;
}
.section-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-count {
  font-size: 11px;
  color: var(--brown-light);
  background: #fdf0e8;
  border-radius: 20px;
  padding: 2px 9px;
  letter-spacing: 0.05em;
}
.section-arrow {
  font-size: 20px;
  color: var(--brown-light);
  transition: transform 0.25s;
  line-height: 1;
}
.section.closed .section-arrow { transform: rotate(-90deg); }
.section.closed .section-header { border-bottom: none; }
.section-items { display: block; }
.section.closed .section-items { display: none; }

/* ITEM */
.item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 20px;
  border-bottom: 1px solid #f8f0ea;
  cursor: pointer;
  transition: background 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.item:last-child { border-bottom: none; }
.item:active { background: #fdf8f4; }
.item.done { background: #fdf8f4; }

.checkbox {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 1.5px solid #ddd;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.item.done .checkbox {
  background: linear-gradient(135deg, #7a3f28, #c27c58);
  border-color: transparent;
}
.checkmark {
  display: none;
  width: 12px; height: 12px;
}
.item.done .checkmark { display: block; }

.item-label {
  font-size: 14px;
  color: var(--text);
  line-height: 1.4;
  transition: all 0.2s;
}
.item.done .item-label {
  color: var(--text-muted);
  text-decoration: line-through;
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 32px;
  padding: 0 16px;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}
.complete-msg {
  display: none;
  background: linear-gradient(135deg, #7a3f28, #c27c58);
  color: #fff;
  border-radius: 14px;
  padding: 18px 24px;
  font-size: 15px;
  letter-spacing: 0.02em;
  margin-top: 32px;
}
.reset-btn {
  background: none;
  border: 1.5px solid #ddd;
  border-radius: 10px;
  padding: 10px 24px;
  font-size: 13px;
  font-family: 'Jost', sans-serif;
  color: var(--text-muted);
  cursor: pointer;
  letter-spacing: 0.05em;
  margin-top: 32px;
}
.reset-btn:active { background: #f8f0ea; }

<body>

<header>
  <div class="header-label">Portrait Session</div>
  <h1>Bridal Flatlay<br><em>Checklist</em></h1>
  <div class="progress-wrap">
    <div class="progress-label" id="progress-label">0 of 29 items packed</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>
</header>

<div class="content" id="sections"></div>

<div class="footer">
  <div class="complete-msg" id="complete-msg">✨ Everything's packed — you're ready to shoot!</div>
  <button class="reset-btn" id="reset-btn" onclick="resetAll()">Reset Checklist</button>
</div>

<script>
  const data = [
    {
      emoji: "👗",
      title: "Clothing & Accessories",
      items: [
        "Wedding dress (steamed & on a hanger)",
        "Veil",
        "Shoes (bridal heels or flats)",
        "Earrings",
        "Necklace",
        "Bracelet",
        "Engagement ring & wedding band",
        "Garter",
        "Something old, new, borrowed & blue",
        "Bridal robe or getting-ready outfit",
        "Lingerie / undergarments",
        "Hair accessories (clips, pins, tiara, comb)",
        "Lipstick / lip gloss for touch-ups",
        "Perfume bottle"
      ]
    },
    {
      emoji: "💌",
      title: "Sentimental & Personal",
      items: [
        "Bouquet (or ribbon mockup bouquet)",
        "Invitation suite (save the date, envelope, menu)",
        "Vows or love letters",
        "Heirloom jewelry or keepsake item",
        "Handkerchief (monogrammed if possible)",
        "Photo of a loved one",
        "Something with the wedding date or initials"
      ]
    },
    {
      emoji: "📸",
      title: "Flatlay Props & Details",
      items: [
        "Ribbon or silk to arrange items",
        "Ring box or ring dish",
        "Dried flowers or petals",
        "Perfume or candle as a styling prop",
        "Small mirror or decorative tray"
      ]
    }
  ];

  const state = {};
  const total = data.reduce((a, s) => a + s.items.length, 0);

  function getKey(section, item) { return section + '__' + item; }

  function updateProgress() {
    const checked = Object.values(state).filter(Boolean).length;
    const pct = Math.round((checked / total) * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-label').textContent = checked + ' of ' + total + ' items packed';
    document.getElementById('complete-msg').style.display = pct === 100 ? 'block' : 'none';
    document.getElementById('reset-btn').style.display = pct === 100 ? 'none' : 'inline-block';
    // update counts
    data.forEach(section => {
      const doneCount = section.items.filter(i => state[getKey(section.title, i)]).length;
      const el = document.getElementById('count-' + section.title);
      if (el) el.textContent = doneCount + '/' + section.items.length;
    });
  }

  function toggleItem(key, el) {
    state[key] = !state[key];
    el.classList.toggle('done', state[key]);
    updateProgress();
  }

  function toggleSection(title) {
    const sec = document.getElementById('sec-' + title);
    sec.classList.toggle('closed');
  }

  function resetAll() {
    Object.keys(state).forEach(k => state[k] = false);
    document.querySelectorAll('.item').forEach(el => el.classList.remove('done'));
    updateProgress();
  }

  // Build DOM
  const container = document.getElementById('sections');
  data.forEach(section => {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = 'sec-' + section.title;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <div class="section-title">
        <span class="section-emoji">${section.emoji}</span>
        <span class="section-name">${section.title}</span>
      </div>
      <div class="section-meta">
        <span class="section-count" id="count-${section.title}">0/${section.items.length}</span>
        <span class="section-arrow">›</span>
      </div>
    `;
    header.addEventListener('click', () => toggleSection(section.title));

    const itemsEl = document.createElement('div');
    itemsEl.className = 'section-items';

    section.items.forEach(item => {
      const key = getKey(section.title, item);
      state[key] = false;
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <div class="checkbox">
          <svg class="checkmark" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="item-label">${item}</span>
      `;
      div.addEventListener('click', () => toggleItem(key, div));
      itemsEl.appendChild(div);
    });

    sec.appendChild(header);
    sec.appendChild(itemsEl);
    container.appendChild(sec);
  });

  updateProgress();
</script>

</body>
</html>
